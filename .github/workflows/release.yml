name: Release

# Pushing a tag vX.Y.Z publishes that version:
#   1. the tag must match "version" in package.json
#   2. the full CI
#   3. image as :x.y.z, :x.y and :latest on Docker Hub and GHCR
#   4. GitHub release with generated notes, only after the image is out
# New version: npm version patch|minor|major && git push --follow-tags
# Run by hand on main: the same checks, then the image as :edge; nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: tristanteu/namarr

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare README for Docker Hub
        run: |
          BLOB=https://github.com/${{ github.repository }}/blob/main
          RAW=https://raw.githubusercontent.com/${{ github.repository }}/main
          # Relative links and images only work on GitHub; Docker Hub needs absolute URLs.
          sed -E -e "s#\]\((\./|/)?(docker|docs)/#](${BLOB}/\2/#g" \
            -e "s#src=\"(\./)?docs/#src=\"${RAW}/docs/#g" README.md > dockerhub-readme.md
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}
          repository: ${{ env.IMAGE }}
          short-description: FileBot-style media matching and ReNamer-style rule renaming in one self-hosted web UI
          readme-filepath: ./dockerhub-readme.md

  github-release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "Docker: \`tristanteu/namarr:${GITHUB_REF_NAME#v}\` · \`ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME#v}\` (also \`:latest\`)"
