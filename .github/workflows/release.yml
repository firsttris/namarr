name: Release

# Builds and pushes the image, then creates the tag and the GitHub release for a version.
#   Run by hand on "main"            → :edge, nothing is tagged
#   Called by "Tag release"          → :x.y.z, :x.y, :latest, then tag vX.Y.Z + GitHub release
#   A v* tag pushed (or run on a tag) → the same for that tag's version
# Tag and release are created only after the image is pushed, so there is never a release
# without an image.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: Version to publish, x.y.z
        type: string
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: tristanteu/namarr

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Version
        env:
          CALLED: ${{ inputs.version }}
        run: |
          if [[ -n "$CALLED" ]]; then
            echo "version=${CALLED#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"   # edge
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.v.outputs.version != '' }}
            type=raw,value=edge,enable=${{ steps.v.outputs.version == '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare README for Docker Hub
        run: |
          BLOB=https://github.com/${{ github.repository }}/blob/main
          RAW=https://raw.githubusercontent.com/${{ github.repository }}/main
          # Relative links and images only work on GitHub; Docker Hub needs absolute URLs.
          sed -E -e "s#\]\((\./|/)?(docker|docs)/#](${BLOB}/\2/#g" \
            -e "s#src=\"(\./)?docs/#src=\"${RAW}/docs/#g" README.md > dockerhub-readme.md
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: tristanteu
          password: ${{ secrets.DOCKER_PAT }}
          repository: ${{ env.IMAGE }}
          short-description: FileBot-style media matching and ReNamer-style rule renaming in one self-hosted web UI
          readme-filepath: ./dockerhub-readme.md

  github-release:
    needs: image
    if: needs.image.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Tag and release v${{ needs.image.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION exists already."
            exit 0
          fi
          # Creates the tag on the built commit when it does not exist yet (call from
          # "Tag release"); a pushed tag is used as it is. A tag made with GITHUB_TOKEN starts
          # no further workflows, so this does not run twice.
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes \
            --notes "Docker: \`tristanteu/namarr:$VERSION\` · \`ghcr.io/$GITHUB_REPOSITORY:$VERSION\` (also \`:latest\`)"
          echo "### Released v$VERSION" >> "$GITHUB_STEP_SUMMARY"
