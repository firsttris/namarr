name: Release

# Pushing a tag vX.Y.Z (bun run release:minor) publishes that version: the full CI (skipped when
# main's CI already tested the code, see https://github.com/firsttris/workflows#tested-on-main), then
# the shared Docker release from firsttris/workflows, which checks the tag against package.json,
# pushes :x.y.z, :x.y and :latest to Docker Hub and GHCR, updates the Docker Hub description and
# creates the GitHub release. Run by hand on main: the same checks, then :edge, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@v1
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  docker:
    needs: [tested, checks]
    # The checks either passed or were not needed
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/namarr
      description: FileBot-style media matching and ReNamer-style rule renaming in one self-hosted web UI
      ghcr: true
    secrets: inherit
    permissions:
      contents: write
      packages: write
