name: Release

# Pushing a tag vX.Y.Z (bun run release:minor) publishes that version: the full CI, then the shared
# Docker release from firsttris/workflows, which checks the tag against package.json, pushes
# :x.y.z, :x.y and :latest to Docker Hub and GHCR, updates the Docker Hub description and creates
# the GitHub release. Run by hand on main: the same checks, then :edge, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: checks
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/namarr
      description: FileBot-style media matching and ReNamer-style rule renaming in one self-hosted web UI
      ghcr: true
    secrets: inherit
    permissions:
      contents: write
      packages: write
