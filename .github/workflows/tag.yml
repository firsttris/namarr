name: Tag release

# Actions → Tag release → Run workflow (from main), all in one run:
#   1. the full CI
#   2. the next version after the newest v* tag (none yet: from 0.0.0), or the exact one given
#   3. the "Release" workflow: image as :x.y.z, :x.y and :latest, then tag vX.Y.Z and the
#      GitHub release with generated notes
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up (no tag yet → from 0.0.0)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version instead, e.g. 0.1.0 (optional)"
        type: string
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start this workflow from main."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Next version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [[ -n "$EXACT" ]]; then
            version="${EXACT#v}"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="${major}.$((minor + 1)).0" ;;
              patch) version="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a version: $version (expected x.y.z)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### v$version (previous: ${latest:-none})" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, checks]
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
