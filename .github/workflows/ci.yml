name: CI

# Changes to documentation alone don't build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "LICENSE"
  # The release workflow runs the same checks before it tags anything.
  workflow_call:

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (core, providers, db, server)
        run: bun run test
      - name: Parser-Benchmark
        run: |
          bun scripts/corpus.ts --fail-under=0.95 | tee corpus.md
          cat corpus.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      # Chromium from the Actions cache, per Playwright version; the system libraries install on
      # every run. The tests compare no screenshots, the runner stays the same as before
      - id: playwright
        working-directory: apps/server
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/server
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/server
      - name: Playwright (Workbench-Flows gegen Demo-Backend)
        run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/server/test-results
